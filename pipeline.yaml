name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency: pipeline-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Run HTMLHint
        run: npx --yes htmlhint index.html
      - name: Run ESLint
        run: npx --yes eslint@8.57.1 script.js

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    permissions:
      packages: read
    env:
      APP_PORT: ${{ secrets.APP_PORT || '8080' }}
    steps:
      - name: Deploy container
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE_DIGEST:?Missing image digest}"
          if [[ ! "$APP_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( APP_PORT > 65535 )); then
            echo '::error::APP_PORT must be a port number between 1 and 65535.'
            exit 1
          fi
          auth_dir=$(mktemp -d)
          trap 'rm -rf -- "$auth_dir"' EXIT
          auth_file="$auth_dir/auth.json"
          printf '%s\n' "$GHCR_TOKEN" | podman --remote=false login \
            --authfile "$auth_file" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          unset GHCR_TOKEN
          podman --remote=false pull --authfile "$auth_file" "$image"
          podman --remote=false rm --force --ignore web-app
          # Keep the detached container running after the runner cleans up job processes.
          env -u RUNNER_TRACKING_ID podman --remote=false run \
            --detach --pull=never --name web-app --restart unless-stopped \
            --publish "${APP_PORT}:80" "$image"
      - name: Check application health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 2 --max-time 5 "http://127.0.0.1:${APP_PORT}/" >/dev/null
